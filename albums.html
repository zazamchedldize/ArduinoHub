<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07110f">
<title>ფოტოალბომები — ArduinoHub</title>
<link rel="icon" type="image/png" href="arduinohub-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=FiraGO:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
color-scheme:dark;
--bg:#07110f;
--panel:#0d1b16;
--panel2:#10231b;
--green:#22d395;
--mint:#a7f3d0;
--muted:#91a69b;
--line:rgba(34,211,149,.17);
--white:#f0fdf4;
--gold:#f5c451;
--red:#fb7185
}

*{box-sizing:border-box}

body{
margin:0;
background:radial-gradient(ellipse at 50% -15%,rgba(34,211,149,.12),transparent 45%),var(--bg);
color:var(--white);
font-family:FiraGO,Inter,sans-serif;
min-height:100vh
}

a{color:inherit;text-decoration:none}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

.wrap{
width:min(1160px,calc(100% - 40px));
margin:auto
}

header{
height:76px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center
}

.head{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px
}

.brand{
font-family:Inter,sans-serif;
font-weight:800;
letter-spacing:-.5px
}

.brand span{color:var(--green)}

.back{
display:inline-flex;
align-items:center;
gap:8px;
color:var(--mint);
font-size:14px
}

main{padding:62px 0 90px}

.eyebrow{
color:var(--green);
font:700 11px Inter,sans-serif;
letter-spacing:2px;
text-transform:uppercase
}

h1{
font-size:clamp(32px,5vw,52px);
line-height:1.12;
margin:12px 0
}

.intro{
max-width:650px;
color:#a7b9af;
line-height:1.75;
margin:0
}

.top{
display:flex;
justify-content:space-between;
align-items:end;
gap:24px;
margin-bottom:34px
}

.primary,.secondary,.danger{
border-radius:12px;
padding:12px 17px;
display:inline-flex;
align-items:center;
justify-content:center;
gap:8px;
cursor:pointer;
font-weight:700;
border:1px solid transparent;
transition:.2s
}

.primary{
background:linear-gradient(135deg,#059669,#22d395);
color:#042016
}

.primary:hover{
transform:translateY(-2px);
filter:brightness(1.08)
}

.secondary{
background:#10231b;
color:var(--mint);
border-color:var(--line)
}

.secondary:hover{border-color:var(--green)}

.danger{
background:rgba(248,113,113,.08);
color:#fca5a5;
border-color:rgba(248,113,113,.25)
}

button:disabled{
opacity:.55;
cursor:not-allowed;
transform:none
}

.admin-tools{
display:none;
gap:10px;
flex-wrap:wrap;
margin:0 0 24px
}

.admin-tools.show{display:flex}

.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:20px
}

.album{
border:1px solid var(--line);
background:linear-gradient(145deg,rgba(16,35,27,.96),rgba(8,20,15,.96));
border-radius:20px;
overflow:hidden;
min-width:0;
transition:transform .22s,border-color .22s
}

.album:hover{
transform:translateY(-4px);
border-color:rgba(34,211,149,.45)
}

.cover{
height:210px;
background:#10231b;
position:relative;
overflow:hidden;
cursor:pointer
}

.cover img,.cover video{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:transform .4s
}

.album:hover .cover img,
.album:hover .cover video{
transform:scale(1.04)
}

.cover-empty{
height:100%;
display:grid;
place-items:center;
color:#4b8068;
background:radial-gradient(circle,rgba(34,211,149,.1),transparent 65%)
}

.cover-empty i{
width:46px;
height:46px
}

.video-play{
position:absolute;
inset:0;
display:grid;
place-items:center;
pointer-events:none
}

.video-play span{
width:58px;
height:58px;
border-radius:50%;
background:rgba(7,17,15,.78);
border:1px solid rgba(255,255,255,.22);
display:grid;
place-items:center;
backdrop-filter:blur(8px)
}

.video-play svg{
width:25px;
height:25px;
fill:var(--green);
color:var(--green);
margin-left:3px
}

.album-info{padding:18px}

.album-info h2{
font-size:19px;
margin:0 0 8px
}

.album-info p{
font-size:13px;
color:var(--muted);
line-height:1.6;
margin:0;
min-height:21px
}

.album-bottom{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-top:17px
}

.count{
font-size:12px;
color:var(--mint);
display:flex;
align-items:center;
gap:6px
}

.album-actions{
display:flex;
gap:7px
}

.icon-btn{
width:34px;
height:34px;
border-radius:10px;
border:1px solid var(--line);
background:#10231b;
color:var(--mint);
display:grid;
place-items:center;
cursor:pointer
}

.icon-btn:hover{border-color:var(--green)}

.social-bar{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
margin-top:15px
}

.social-btn{
min-height:34px;
padding:7px 11px;
border-radius:10px;
border:1px solid rgba(255,255,255,.08);
background:#0a1813;
color:#a8bbb2;
display:inline-flex;
align-items:center;
gap:6px;
font-size:12px;
transition:.2s
}

.social-btn svg{
width:16px;
height:16px
}

.social-btn:hover{
border-color:rgba(34,211,149,.4);
color:var(--white)
}

.social-btn.liked{
color:#ff6b81;
border-color:rgba(255,107,129,.35);
background:rgba(255,107,129,.08)
}

.social-btn.admin-liked{
color:var(--gold);
border-color:rgba(245,196,81,.52);
background:linear-gradient(135deg,rgba(245,196,81,.13),rgba(34,211,149,.08));
box-shadow:0 0 22px rgba(245,196,81,.1)
}

.admin-like-badge{
display:inline-flex;
align-items:center;
gap:5px;
color:var(--gold);
font-size:10px;
font-weight:800;
letter-spacing:.6px;
padding:6px 8px;
border-radius:8px;
border:1px solid rgba(245,196,81,.3);
background:rgba(245,196,81,.08)
}

.empty,.loading{
border:1px dashed rgba(34,211,149,.25);
border-radius:18px;
padding:45px 20px;
text-align:center;
color:var(--muted);
grid-column:1/-1
}

.empty i{
color:var(--green);
width:38px;
height:38px;
margin-bottom:12px
}

.empty strong{
display:block;
color:var(--white);
margin-bottom:7px
}

.gallery{
display:none;
margin-top:38px;
border-top:1px solid var(--line);
padding-top:30px
}

.gallery.show{display:block}

.gallery-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:20px
}

.gallery-head h2{
font-size:25px;
margin:0
}

.photos{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:14px
}

.photo{
position:relative;
aspect-ratio:1/1;
border-radius:16px;
overflow:hidden;
background:#10231b;
border:1px solid var(--line)
}

.photo img,.photo video{
width:100%;
height:100%;
object-fit:cover;
display:block;
cursor:zoom-in
}

.photo .delete-photo{
position:absolute;
top:8px;
right:8px;
display:none;
z-index:4
}

.photo.admin .delete-photo{display:grid}

.photo-caption{
position:absolute;
bottom:0;
left:0;
right:0;
padding:34px 10px 10px;
background:linear-gradient(transparent,rgba(0,0,0,.88));
font-size:12px;
pointer-events:none;
z-index:2
}

.media-type{
position:absolute;
top:8px;
left:8px;
z-index:3;
display:inline-flex;
align-items:center;
gap:5px;
padding:6px 8px;
border-radius:8px;
background:rgba(7,17,15,.78);
border:1px solid rgba(255,255,255,.12);
color:var(--mint);
font-size:10px;
font-weight:700;
backdrop-filter:blur(7px)
}

.photo-social{
position:absolute;
left:8px;
right:8px;
bottom:8px;
z-index:5;
display:flex;
gap:6px;
pointer-events:none
}

.photo-social .social-btn{
pointer-events:auto;
background:rgba(7,17,15,.82);
backdrop-filter:blur(7px);
min-height:31px;
padding:6px 9px
}

.photo-social .social-btn svg{
width:14px;
height:14px
}

.media-admin-like{
position:absolute;
top:8px;
right:8px;
z-index:3;
display:inline-flex;
align-items:center;
gap:4px;
padding:5px 7px;
border-radius:7px;
color:var(--gold);
background:rgba(7,17,15,.86);
border:1px solid rgba(245,196,81,.38);
font-size:9px;
font-weight:800;
box-shadow:0 0 15px rgba(245,196,81,.08)
}

.modal{
position:fixed;
inset:0;
z-index:20;
background:rgba(0,0,0,.78);
backdrop-filter:blur(8px);
display:none;
place-items:center;
padding:18px
}

.modal.show{display:grid}

.dialog{
width:min(100%,480px);
max-height:90vh;
overflow:auto;
background:linear-gradient(145deg,#10231b,#07110f);
border:1px solid rgba(34,211,149,.3);
border-radius:22px;
padding:26px;
box-shadow:0 25px 90px #0009
}

.dialog.comments-dialog{
width:min(100%,720px)
}

.dialog h2{
margin:0 0 20px;
font-size:23px
}

.comments-target{
color:var(--muted);
font-size:13px;
margin-top:-10px;
margin-bottom:18px
}

.comment-list{
display:grid;
gap:13px;
max-height:430px;
overflow:auto;
padding:5px 4px 8px
}

.comment-thread{
display:grid;
gap:10px
}

.comment-item{
position:relative;
border:1px solid rgba(255,255,255,.07);
background:linear-gradient(145deg,rgba(17,36,28,.96),rgba(7,20,15,.96));
border-radius:17px;
padding:15px;
box-shadow:0 8px 25px rgba(0,0,0,.12);
transition:.2s
}

.comment-item:hover{
border-color:rgba(34,211,149,.2);
transform:translateY(-1px)
}

.comment-item.admin-comment{
border-color:rgba(245,196,81,.42);
background:linear-gradient(145deg,rgba(245,196,81,.1),rgba(34,211,149,.04)),#091712;
box-shadow:0 0 25px rgba(245,196,81,.07),inset 0 0 0 1px rgba(245,196,81,.04)
}

.comment-item.admin-liked-comment{
border-color:rgba(245,196,81,.58);
background:linear-gradient(145deg,rgba(245,196,81,.13),rgba(34,211,149,.045)),#091712;
box-shadow:0 0 28px rgba(245,196,81,.11),inset 0 0 0 1px rgba(245,196,81,.06)
}

.comment-item.reply{
margin-left:34px;
border-left:2px solid rgba(34,211,149,.35);
border-radius:14px
}

.comment-item.reply.admin-comment,
.comment-item.reply.admin-liked-comment{
border-left-color:var(--gold)
}

.reply-line{
position:absolute;
left:-22px;
top:-13px;
width:20px;
height:30px;
border-left:1px solid rgba(34,211,149,.3);
border-bottom:1px solid rgba(34,211,149,.3);
border-radius:0 0 0 10px
}

.comment-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
margin-bottom:10px
}

.comment-author{
display:flex;
align-items:center;
gap:9px;
font-size:13px;
font-weight:800
}

.author-avatar{
width:34px;
height:34px;
border-radius:11px;
display:grid;
place-items:center;
background:linear-gradient(145deg,#123d2d,#0a1d15);
border:1px solid rgba(34,211,149,.2);
color:var(--mint);
font-size:12px;
font-weight:800;
flex:none
}

.admin-comment .author-avatar,
.admin-liked-comment .author-avatar{
background:linear-gradient(145deg,#594715,#211c0c);
border-color:rgba(245,196,81,.45);
color:var(--gold)
}

.author-details{
display:flex;
flex-direction:column;
gap:3px
}

.author-name{
color:var(--white);
line-height:1.2
}

.admin-comment .author-name,
.admin-liked-comment .author-name{
color:#ffe9a1
}

.comment-date{
color:#60766c;
font-size:10px
}

.admin-badge{
display:inline-flex;
align-items:center;
gap:4px;
padding:4px 6px;
border-radius:6px;
color:var(--gold);
background:rgba(245,196,81,.08);
border:1px solid rgba(245,196,81,.25);
font-size:8px;
font-weight:800;
letter-spacing:.6px
}

.comment-text{
color:#d0ddd6;
line-height:1.7;
font-size:13px;
white-space:pre-wrap;
word-break:break-word;
padding-left:43px
}

.reply-to{
display:inline-flex;
align-items:center;
gap:5px;
color:#7de5ba;
font-size:10px;
font-weight:700;
margin-left:43px;
margin-bottom:7px;
padding:5px 7px;
border-radius:7px;
background:rgba(34,211,149,.055);
border:1px solid rgba(34,211,149,.12)
}

.comment-actions{
display:flex;
align-items:center;
gap:7px;
padding-left:43px;
margin-top:12px;
flex-wrap:wrap
}

.comment-action{
border:1px solid rgba(255,255,255,.07);
background:#081610;
color:#8fa39a;
border-radius:9px;
padding:6px 9px;
display:inline-flex;
align-items:center;
gap:5px;
font-size:11px;
transition:.2s
}

.comment-action:hover{
color:var(--white);
border-color:rgba(34,211,149,.3)
}

.comment-action.liked{
color:#ff6b81;
border-color:rgba(255,107,129,.3);
background:rgba(255,107,129,.07)
}

.comment-action.admin-liked{
color:var(--gold);
border-color:rgba(245,196,81,.5);
background:rgba(245,196,81,.09);
box-shadow:0 0 15px rgba(245,196,81,.08)
}

.comment-delete{
border:0;
background:transparent;
color:#7e8e87;
padding:6px;
display:grid;
place-items:center
}

.comment-delete:hover{color:var(--red)}

.comment-admin-like{
display:inline-flex;
align-items:center;
gap:4px;
color:var(--gold);
font-size:9px;
font-weight:800;
padding:5px 7px;
border-radius:7px;
background:rgba(245,196,81,.08);
border:1px solid rgba(245,196,81,.28)
}

.comment-form{
margin-top:18px;
padding-top:18px;
border-top:1px solid var(--line)
}

.replying{
display:none;
align-items:center;
justify-content:space-between;
gap:10px;
padding:9px 11px;
margin-bottom:9px;
border-radius:10px;
background:rgba(34,211,149,.06);
border:1px solid rgba(34,211,149,.16);
color:var(--mint);
font-size:11px
}

.replying.show{display:flex}

.cancel-reply{
border:0;
background:transparent;
color:#8ca59a;
font-size:11px
}

.cancel-reply:hover{color:var(--white)}

.comment-form textarea{
width:100%;
min-height:90px;
resize:vertical;
border:1px solid var(--line);
background:#06130e;
color:white;
border-radius:13px;
padding:13px;
outline:none
}

.comment-form textarea:focus{
border-color:var(--green);
box-shadow:0 0 0 3px rgba(34,211,149,.06)
}

.comment-form-actions{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-top:10px
}

.login-note{
color:var(--muted);
font-size:12px;
line-height:1.6
}

.field{
display:grid;
gap:7px;
margin-bottom:15px
}

.field label{
font-size:13px;
color:var(--mint);
font-weight:700
}

.field input,
.field textarea{
width:100%;
border:1px solid var(--line);
background:#06130e;
color:white;
border-radius:11px;
padding:12px;
outline:none
}

.field input:focus,
.field textarea:focus{
border-color:var(--green)
}

.field textarea{
resize:vertical;
min-height:90px
}

.dialog-actions{
display:flex;
justify-content:flex-end;
gap:9px;
margin-top:20px
}

.status{
font-size:13px;
color:var(--mint);
min-height:18px;
margin-top:8px
}

.lightbox{
position:fixed;
inset:0;
z-index:30;
background:rgba(0,0,0,.94);
display:none;
align-items:center;
justify-content:center;
padding:65px 70px
}

.lightbox.show{display:flex}

.lightbox-content{
width:min(100%,1000px);
height:min(100%,760px);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:14px
}

.lightbox img,
.lightbox video{
max-width:100%;
max-height:calc(100% - 70px);
object-fit:contain;
border-radius:8px
}

.lightbox-info{
width:min(100%,700px);
text-align:center;
color:#c9d8d1;
font-size:13px
}

.lightbox button{
position:absolute;
border:1px solid #ffffff30;
background:#10231b;
color:white;
border-radius:50%;
width:42px;
height:42px;
display:grid;
place-items:center;
cursor:pointer
}

#light-close{
top:18px;
right:18px
}

#light-prev{left:18px}
#light-next{right:18px}

.lightbox-social{
display:flex;
align-items:center;
justify-content:center;
gap:8px
}

footer{
border-top:1px solid var(--line);
padding:22px 0;
color:var(--muted);
font-size:12px
}

@media(max-width:850px){
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.photos{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media(max-width:600px){
.wrap{width:min(100% - 28px,1160px)}
header{height:64px}
main{padding:42px 0 65px}
.top{align-items:start;flex-direction:column}
.grid{grid-template-columns:1fr}
.cover{height:220px}
.photos{grid-template-columns:repeat(2,minmax(0,1fr))}
.gallery-head{align-items:start;flex-direction:column}
.lightbox{padding:60px 48px}
.dialog{padding:22px}
.comment-item.reply{margin-left:14px}
.comment-text,
.comment-actions,
.reply-to{padding-left:0;margin-left:0}
.author-avatar{width:31px;height:31px}
.reply-line{left:-12px}
}
</style>
</head>

<body>

<header>
<div class="wrap head">
<a class="brand" href="index.html">ArduinoChemistry<span>Hub</span></a>

<a class="back" href="index.html">
<i data-lucide="arrow-left"></i>
მთავარზე დაბრუნება
</a>
</div>
</header>

<main class="wrap">

<div class="top">
<div>
<p class="eyebrow">ARDUINOHUB • GALLERY</p>
<h1>ფოტოალბომები</h1>
<p class="intro">
კლუბის შეხვედრების, პროექტებისა და ღონისძიებების მოგონებები ერთ სივრცეში.
</p>
</div>

<button id="create-open" class="primary" style="display:none">
<i data-lucide="plus"></i>
ალბომის შექმნა
</button>
</div>

<div id="admin-tools" class="admin-tools">
<button id="upload-open" class="secondary" disabled>
<i data-lucide="upload"></i>
მედიის ატვირთვა
</button>

<span id="admin-label" style="align-self:center;color:var(--muted);font-size:12px"></span>
</div>

<section id="album-grid" class="grid">
<div class="loading">ალბომები იტვირთება...</div>
</section>

<section id="gallery" class="gallery">

<div class="gallery-head">

<div>
<p class="eyebrow">ALBUM</p>
<h2 id="gallery-title"></h2>
<p id="gallery-description" class="intro" style="font-size:13px;margin-top:7px"></p>
<div id="gallery-social"></div>
</div>

<button id="gallery-close" class="secondary">
<i data-lucide="arrow-up"></i>
ალბომებზე დაბრუნება
</button>

</div>

<div id="photo-grid" class="photos"></div>

</section>

</main>

<footer>
<div class="wrap">
© <span id="year"></span> ArduinoHub
</div>
</footer>

<div id="album-modal" class="modal" role="dialog" aria-modal="true">

<form id="album-form" class="dialog">

<h2>ახალი ალბომი</h2>

<div class="field">

function escapeHtml(value=""){
return String(value).replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[char]))
}

function storageUrl(path){
return supabaseClient.storage.from(BUCKET).getPublicUrl(path).data.publicUrl
}

function getExtension(name=""){
const parts=String(name).toLowerCase().split(".")
return parts.length>1?parts.pop():""
}

function getMimeType(file){
if(file.type){
return file.type.toLowerCase()
}

const extension=getExtension(file.name)

const mimeTypes={
jpg:"image/jpeg",
jpeg:"image/jpeg",
png:"image/png",
webp:"image/webp",
gif:"image/gif",
avif:"image/avif",
heic:"image/heic",
heif:"image/heif",
mp4:"video/mp4",
webm:"video/webm",
mov:"video/quicktime",
m4v:"video/x-m4v",
ogg:"video/ogg",
ogv:"video/ogg",
avi:"video/x-msvideo"
}

return mimeTypes[extension]||"application/octet-stream"
}

function getMediaType(item){
const extension=getExtension(item.name||item.storage_path||"")

if([
"mp4",
"webm",
"mov",
"m4v",
"ogg",
"ogv",
"avi"
].includes(extension)){
return "video"
}

if(String(item.mime_type||"").startsWith("video/")){
return "video"
}

return "image"
}

function isAllowedMedia(file){
const mime=getMimeType(file)

if(mime.startsWith("image/")){
return true
}

if(mime.startsWith("video/")){
return true
}

return [
"mp4",
"webm",
"mov",
"m4v",
"ogg",
"ogv",
"avi"
].includes(getExtension(file.name))
}

function normalizeAdminDisplayName(value){

}

return original
}

function getUserDisplayName(user){
if(!user){
return "მომხმარებელი"
}

const metadata=user.user_metadata||{}
const email=String(user.email||"").trim().toLowerCase()

if(ADMIN_DISPLAY_NAMES[email]){
return ADMIN_DISPLAY_NAMES[email]
}

const metadataEmail=String(
metadata.email||
metadata.email_address||
""
).trim().toLowerCase()

if(ADMIN_DISPLAY_NAMES[metadataEmail]){
return ADMIN_DISPLAY_NAMES[metadataEmail]
}

const name=String(
metadata.full_name||
metadata.name||
metadata.username||
metadata.display_name||
user.email?.split("@")[0]||
"მომხმარებელი"
).trim()

return normalizeAdminDisplayName(name)
}

function getCommentDisplayName(comment){
if(!comment){
return "მომხმარებელი"
}

let name=String(comment.author_name||"").trim()

name=normalizeAdminDisplayName(name)

if(
adminUserIds.has(comment.user_id)&&

name.includes("@")||
name==="მომხმარებელი"
)
){
if(currentUser&&currentUser.id===comment.user_id){
return getUserDisplayName(currentUser)
}

return "ადმინისტრატორი"
}

return name||"მომხმარებელი"
}

function getInitials(name){
const value=String(name||"მომხმარებელი").trim()
const parts=value.split(/\s+/).filter(Boolean)

if(value==="ზმ"){
return "ზმ"
}

if(parts.length>=2){
return (parts[0][0]+parts[1][0]).toUpperCase()
}

return value.slice(0,2).toUpperCase()
}

function formatDate(date){
if(!date){
return ""
}

try{
return new Intl.DateTimeFormat("ka-GE",{
day:"2-digit",
month:"short",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}).format(new Date(date))
}catch{
return ""
}
}

async function toggleLike(type,id){

const user=await getCurrentUser()

if(!user){
alert("Like-ის დასაწერად ანგარიშში უნდა შეხვიდე.")
return
}

const existing=albumLikes.find(item=>
item.user_id===user.id&&
(
type==="album"
?item.album_id===id
:item.photo_id===id
)
)

if(existing){

const {error}=await supabaseClient
.from("album_likes")
.delete()
.eq("id",existing.id)

if(error){
alert("Like-ის წაშლა ვერ მოხერხდა: "+error.message)
return
}

albumLikes=albumLikes.filter(
item=>item.id!==existing.id
)

}else{

const payload=type==="album"
?{
user_id:user.id,
album_id:id
}
:{
user_id:user.id,
photo_id:id
}

const {data,error}=await supabaseClient
.from("album_likes")
.insert(payload)
.select("id,user_id,album_id,photo_id")
.single()

if(error){
alert("Like ვერ დაემატა: "+error.message)
return
}

if(data){
albumLikes.push(data)
}
}

await renderAlbums()

if(currentAlbum){
await openAlbum(currentAlbum.id)
}
}

}else{

const photo=currentPhotos.find(item=>item.id===id)
title=photo?.caption||"ფოტო ან ვიდეო"

}

commentsTargetTitle=title

$("comments-title").textContent="კომენტარები"
$("comments-target").textContent=title
$("comment-text").value=""

cancelReply()

const user=await getCurrentUser()

if(user){

$("comment-login-note").textContent=
"კომენტარი გამოქვეყნდება სახელით: "+getUserDisplayName(user)

$("comment-submit").disabled=false
$("comment-text").disabled=false

}else{

$("comment-login-note").textContent=
"კომენტარის დასაწერად ანგარიშში უნდა შეხვიდე."

$("comment-submit").disabled=true
$("comment-text").disabled=true
}

showModal("comments-modal")

await renderComments()

lucide.createIcons()
}

function getCommentChildren(parentId){

return albumComments
.filter(item=>item.parent_comment_id===parentId)
.sort(
(a,b)=>
new Date(a.created_at)-new Date(b.created_at)
)
}

function getParentComment(comment){

if(!comment?.parent_comment_id){
return null
}

return albumComments.find(
item=>item.id===comment.parent_comment_id
)||null
}

function buildCommentHtml(comment,isReply=false){

const likes=getCommentLikes(comment.id)
const liked=userLiked(likes)
const adminLike=adminLiked(likes)
const admin=adminUserIds.has(comment.user_id)

const author=getCommentDisplayName(comment)
const parent=getParentComment(comment)

const canDelete=
currentUser&&
currentUser.id===comment.user_id

const children=getCommentChildren(comment.id)

return `
<article class="comment-item ${admin?"admin-comment":""} ${adminLike?"admin-liked-comment":""} ${isReply?"reply":""}">

${isReply?`
<span class="reply-line"></span>
`:""}

<div class="comment-top">

<div class="comment-author">

<div class="author-avatar">
${escapeHtml(getInitials(author))}
</div>

<div class="author-details">

<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">

<span class="author-name">
${escapeHtml(author)}
</span>

${admin?`
<span class="admin-badge">
<i data-lucide="shield-check"></i>
ADMIN
</span>
`:""}

</div>

<span class="comment-date">
${formatDate(comment.created_at)}
</span>

</div>

</div>

</div>

${parent?`
<div class="reply-to">
<i data-lucide="corner-down-right"></i>
პასუხი: ${escapeHtml(getCommentDisplayName(parent))}
</div>
`:""}

<div class="comment-text">
${escapeHtml(comment.comment)}
</div>

<div class="comment-actions">

<button
class="comment-action ${liked?"liked":""} ${adminLike?"admin-liked":""}"
data-comment-like="${escapeHtml(comment.id)}">

<i data-lucide="heart"></i>

<span>${likes.length}</span>

</button>

<button
class="comment-action"
data-comment-reply="${escapeHtml(comment.id)}">

<i data-lucide="reply"></i>

პასუხი

</button>

${adminLike?`
<span class="comment-admin-like">
<i data-lucide="shield-check"></i>
ADMIN LIKE
</span>
`:""}

${canDelete?`
<button
class="comment-delete"
data-comment-delete="${escapeHtml(comment.id)}"
title="კომენტარის წაშლა">

<i data-lucide="trash-2"></i>

</button>
`:""}

</div>

</article>

${children.length?`
<div class="comment-thread">
${children.map(child=>buildCommentHtml(child,true)).join("")}
</div>
`:""}
`
}

async function renderComments(){

let comments=
commentsTargetType==="album"
?getCommentsForAlbum(commentsTargetId)
:getCommentsForPhoto(commentsTargetId)

comments=comments
.filter(item=>!item.parent_comment_id)
.sort(
(a,b)=>
new Date(a.created_at)-new Date(b.created_at)
)

if(!comments.length){

$("comment-list").innerHTML=`
<div class="empty">

<i data-lucide="message-circle"></i>

<strong>ჯერ კომენტარი არ არის</strong>

<span>იყავი პირველი ვინც კომენტარს დაწერს.</span>

</div>
`

lucide.createIcons()

return
}

$("comment-list").innerHTML=
comments.map(comment=>buildCommentHtml(comment)).join("")

lucide.createIcons()

$("comment-list")
.querySelectorAll("[data-comment-like]")
.forEach(element=>{

element.addEventListener("click",()=>{

element.dataset.commentLike
)

})

})

.querySelectorAll("[data-comment-reply]")
.forEach(element=>{

element.dataset.commentReply

})

.querySelectorAll("[data-comment-delete]")
.forEach(element=>{

element.addEventListener("click",()=>{

element.dataset.commentDelete
)

})

})
}

async function toggleCommentLike(id){

const user=await getCurrentUser()

if(!user){
alert("კომენტარის დასალაიქებლად ანგარიშში უნდა შეხვიდე.")
return
}

const existing=commentLikes.find(item=>
item.user_id===user.id&&
item.comment_id===id
)

if(existing){

const {error}=await supabaseClient
.from("album_comment_likes")
.delete()
.eq("id",existing.id)

if(error){
alert("კომენტარის Like-ის წაშლა ვერ მოხერხდა: "+error.message)
return
}

commentLikes=commentLikes.filter(
item=>item.id!==existing.id
)

}else{

const {data,error}=await supabaseClient
.from("album_comment_likes")
.insert({
user_id:user.id,
comment_id:id
})
.select("id,user_id,comment_id")
.single()

if(error){
alert("კომენტარის Like ვერ დაემატა: "+error.message)
return
}

if(data){
commentLikes.push(data)
}
}

await renderComments()
await refreshSocialAfterComment()
}

function startReply(commentId){

const comment=albumComments.find(
item=>item.id===commentId
)

if(!comment){
return
}

replyParentId=commentId

const author=getCommentDisplayName(comment)

$("replying-text").textContent=
"პასუხობ: "+author

$("replying").classList.add("show")

$("comment-text").placeholder=
author+"-სთვის პასუხის დაწერა..."

$("comment-text").focus()
}

function cancelReply(){

replyParentId=null

$("replying").classList.remove("show")

$("comment-text").placeholder=
"დაწერე კომენტარი..."
}

async function submitComment(event){

event.preventDefault()

const user=await getCurrentUser()

if(!user){
alert("კომენტარის დასაწერად ანგარიშში უნდა შეხვიდე.")
return
}

const text=$("comment-text").value.trim()

if(!text){
return
}

if(text.length>500){
alert("კომენტარი მაქსიმუმ 500 სიმბოლო უნდა იყოს.")
return
}

const button=$("comment-submit")

button.disabled=true

const payload={
user_id:user.id,
comment:text,
author_name:getUserDisplayName(user)
}

if(commentsTargetType==="album"){
payload.album_id=commentsTargetId
}else{
payload.photo_id=commentsTargetId
}

if(replyParentId){
payload.parent_comment_id=replyParentId
}

const {data,error}=await supabaseClient
.from("album_comments")
.insert(payload)
.select("id,user_id,album_id,photo_id,comment,author_name,created_at,parent_comment_id")
.single()

if(error){

alert("კომენტარი ვერ დაემატა: "+error.message)

button.disabled=false

return
}

if(data){
albumComments.push(data)
}

$("comment-text").value=""

cancelReply()

await loadSocialData()
await renderComments()

button.disabled=false

await refreshSocialAfterComment()
}

async function refreshSocialAfterComment(){

await loadSocialData()
await renderAlbums()

if(currentAlbum){
await openAlbum(currentAlbum.id)
}
}

async function deleteComment(id){

if(!confirm("წავშალოთ ეს კომენტარი და მისი პასუხებიც?")){
return
}

const comment=albumComments.find(
item=>item.id===id
)

if(!comment){
return
}

const user=await getCurrentUser()

if(!user||user.id!==comment.user_id){
alert("ამ კომენტარის წაშლა მხოლოდ მის ავტორს შეუძლია.")
return
}

const {error}=await supabaseClient
.from("album_comments")
.delete()
.eq("id",id)

if(error){
alert("კომენტარის წაშლა ვერ მოხერხდა: "+error.message)
return
}

albumComments=albumComments.filter(
item=>
item.id!==id&&
item.parent_comment_id!==id
)

commentLikes=commentLikes.filter(
item=>item.comment_id!==id
)

await loadSocialData()
await renderComments()
await refreshSocialAfterComment()
}

function showLightbox(index){

if(!currentPhotos.length){
return
}

lightIndex=
(index+currentPhotos.length)%
currentPhotos.length

renderLightboxMedia()

$("lightbox").classList.add("show")
}

function renderLightboxMedia(){

const media=currentPhotos[lightIndex]

if(!media){
return
}

const type=getMediaType(media)
const source=storageUrl(media.storage_path)

if(type==="video"){

$("light-media").innerHTML=`
<video
src="${escapeHtml(source)}"
controls
autoplay
playsinline>
</video>
`

}else{

$("light-media").innerHTML=`
<img
src="${escapeHtml(source)}"
alt="${escapeHtml(media.caption||currentAlbum?.title||"ფოტო")}">
`
}

$("lightbox-info").textContent=
media.caption||
currentAlbum?.title||
""

const likes=getLikesForPhoto(media.id)
const comments=getCommentsForPhoto(media.id)

const liked=userLiked(likes)
const adminLike=adminLiked(likes)

$("lightbox-social").innerHTML=`

<button
class="social-btn ${liked?"liked":""} ${adminLike?"admin-liked":""}"
id="light-like">

<i data-lucide="heart"></i>

<span>${likes.length}</span>

</button>

<button
class="social-btn"
id="light-comments">

<i data-lucide="message-circle"></i>

<span>${comments.length}</span>

</button>

${adminLike?`
<span class="admin-like-badge">
<i data-lucide="shield-check"></i>
ADMIN LIKE
</span>
`:""}

`

$("light-like").addEventListener("click",async()=>{

await toggleLike(
"photo",
media.id
)

renderLightboxMedia()

})

$("light-comments").addEventListener("click",async()=>{

await openComments(
"photo",
media.id
)

})

lucide.createIcons()
}

function moveLight(step){

if(!currentPhotos.length){
return
}

lightIndex=
(lightIndex+step+currentPhotos.length)%
currentPhotos.length

renderLightboxMedia()
}

const description=$("album-desc").value.trim()

if(!title){

}

)

})

async function editAlbum(id){

const album=albums.find(
item=>item.id===id
)

if(!album){
return
}

const title=prompt(
"შეიყვანე ალბომის ახალი სახელი:",
album.title
)

if(title===null){
return
}

if(!title.trim()){
alert("ალბომის სახელი ცარიელი არ უნდა იყოს.")
return
}

const description=prompt(
"შეიყვანე აღწერა:",
album.description||""
)

if(description===null){
return
}

const {error}=await supabaseClient
.from("photo_albums")
.update({
title:title.trim(),
description:description.trim()
})
.eq("id",id)

if(error){
alert("შეცდომა: "+error.message)
return
}

await loadAlbums()

if(currentAlbum?.id===id){
await openAlbum(id)
}
}

async function deleteAlbum(id){

const album=albums.find(
item=>item.id===id
)

if(!album){
return
}

if(!confirm(
'წავშალოთ ალბომი "'+
album.title+
'" და მასში არსებული ფოტოები და ვიდეოები?'
)){
return
}

const {data:media}=await supabaseClient
.from("album_photos")
.select("id,storage_path")
.eq("album_id",id)

if(media?.length){

const {error:storageError}=
await supabaseClient
.storage
.from(BUCKET)
.remove(
media.map(item=>item.storage_path)
)

if(storageError){

alert(
"ფაილების საცავიდან წაშლა ვერ მოხერხდა: "+
storageError.message
)

return
}
}

const {error}=await supabaseClient
.from("photo_albums")
.delete()
.eq("id",id)

if(error){
alert("შეცდომა: "+error.message)
return
}

$("gallery").classList.remove("show")

currentAlbum=null

await loadSocialData()
await loadAlbums()
}

async function uploadPhotos(event){

event.preventDefault()

const albumId=$("upload-album").value
const files=[...$("photo-files").files]

if(!albumId||!files.length){
return
}

const submit=$("upload-submit")

submit.disabled=true

let done=0

for(const file of files){

if(file.size>MAX_FILE_SIZE){

notify(
"upload-status",
file.name+" 50 MB-ზე დიდია."
)

continue
}

if(!isAllowedMedia(file)){

notify(
"upload-status",
file.name+" მხარდაჭერილი ფოტო ან ვიდეო არ არის."
)

continue
}

const mime=getMimeType(file)

const safeName=file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
)

const path=
albumId+
"/"+
crypto.randomUUID()+
"-"+
safeName

notify(
"upload-status",
"იტვირთება "+(++done)+" / "+files.length
)

const {error:uploadError}=
await supabaseClient
.storage
.from(BUCKET)
.upload(
path,
file,
{
upsert:false,
contentType:mime
}
)

if(uploadError){

notify(
"upload-status",
"ატვირთვის შეცდომა: "+
uploadError.message
)

submit.disabled=false

return
}

const {error:rowError}=
await supabaseClient
.from("album_photos")
.insert({
album_id:albumId,
storage_path:path,
caption:$("photo-caption").value.trim()
})

if(rowError){

await supabaseClient
.storage
.from(BUCKET)
.remove([path])

notify(
"upload-status",
"მონაცემის შენახვის შეცდომა: "+
rowError.message
)

submit.disabled=false

return
}
}

submit.disabled=false

$("upload-form").reset()

hideModal("upload-modal")

await loadAlbums()

if(currentAlbum){
await openAlbum(currentAlbum.id)
}
}
