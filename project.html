  <!-- =========================================
       PROJECT DETAIL PAGE — REDESIGN
       Scoped to body[data-page="detail"] so no other page is affected.
       Uses the existing theme variables (--bg, --panel, --line, --text,
       --muted, --green, --green2) – no new colors are introduced.
  ========================================== -->

  <style>

    /* ---------- Page frame ---------- */

    body[data-page="detail"] .detail-shell{
      max-width:1216px;
      padding:36px 32px 90px;
    }

    /* ---------- Back button ---------- */

    body[data-page="detail"] .back-link{
      display:inline-flex;
      align-items:center;
      gap:9px;
      margin:0 0 30px;
      padding:9px 16px 9px 12px;
      min-height:40px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#ffffff08;
      color:var(--text);
      font-size:13px;
      font-weight:600;
      transition:border-color .2s,color .2s,background .2s,box-shadow .2s;
    }

    body[data-page="detail"] .back-link svg{
      width:16px;
      height:16px;
      color:var(--green);
      transition:transform .2s;
    }

    body[data-page="detail"] .back-link:hover{
      color:var(--green);
      border-color:#36c596;
      background:#22d39510;
      box-shadow:0 0 20px #22d3950b;
    }

    body[data-page="detail"] .back-link:hover svg{
      transform:translateX(-3px);
    }

    /* ---------- Article ---------- */

    body[data-page="detail"] .detail{
      min-width:0;
    }

    /* ---------- Hero: title, description, image, info cards ----------
       The markup produced by script.js is:
       .detail-hero > div > (.card-meta > span + time), h1, p, .author-line
       plus img.detail-image. The wrapper elements use display:contents
       so every piece becomes a direct grid item of .detail-hero.        */

    body[data-page="detail"] .detail-hero{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      align-items:stretch;
      padding:0;
      border:0;
    }

    body[data-page="detail"] .detail-hero > div,
    body[data-page="detail"] .detail-hero .card-meta{
      display:contents;
    }

    body[data-page="detail"] .detail-hero h1{
      order:1;
      grid-column:1 / -1;
      margin:0 0 6px;
      font-size:clamp(34px,5.2vw,64px);
      line-height:1.04;
      overflow-wrap:anywhere;
    }

    body[data-page="detail"] .detail-hero h1::before{
      content:"// PROJECT";
      display:block;
      margin-bottom:18px;
      font:700 12px/1 "JetBrains Mono",monospace;
      letter-spacing:.2em;
      color:var(--green);
    }

    body[data-page="detail"] .detail-hero p{
      order:2;
      grid-column:1 / -1;
      max-width:760px;
      margin:0 0 14px;
      padding-left:18px;
      border-left:2px solid #22d39555;
      font-size:clamp(15px,1.6vw,18px);
      line-height:1.75;
      overflow-wrap:anywhere;
    }

    body[data-page="detail"] .detail-image{
      order:3;
      grid-column:1 / -1;
      display:block;
      width:100%;
      height:auto;
      aspect-ratio:16 / 9;
      max-height:560px;
      object-fit:cover;
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:0 18px 50px #0006;
    }

    /* Info cards: category / date / author */

    body[data-page="detail"] .detail-hero .card-meta span,
    body[data-page="detail"] .detail-hero .card-meta time,
    body[data-page="detail"] .detail-hero .author-line{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:7px;
      min-width:0;
      padding:18px 20px;
      background:linear-gradient(145deg,var(--panel),#0a1714);
      border:1px solid var(--line);
      border-radius:14px;
      color:var(--text);
      font:700 16px/1.3 Inter,FiraGO,sans-serif;
      overflow-wrap:anywhere;
      transition:border-color .2s,transform .2s;
    }

    body[data-page="detail"] .detail-hero .card-meta span:hover,
    body[data-page="detail"] .detail-hero .card-meta time:hover,
    body[data-page="detail"] .detail-hero .author-line:hover{
      border-color:#2c6653;
      transform:translateY(-2px);
    }

    body[data-page="detail"] .detail-hero .card-meta span{
      order:4;
      color:var(--green2);
      text-transform:capitalize;
    }

    body[data-page="detail"] .detail-hero .card-meta time{
      order:5;
    }

    body[data-page="detail"] .detail-hero .author-line{
      order:6;
      display:grid;
      grid-template-columns:auto minmax(0,1fr);
      align-items:center;
      column-gap:10px;
      row-gap:7px;
      color:var(--green2);
    }

    body[data-page="detail"] .detail-hero .author-line svg{
      width:18px;
      height:18px;
      flex:none;
    }

    /* Small mono label on every info card */

    body[data-page="detail"] .detail-hero .card-meta time::before,
    body[data-page="detail"] .detail-hero .author-line::before{

      font:600 11px/1 "JetBrains Mono",monospace;

      color:var(--muted);
    }

    body[data-page="detail"] .detail-hero .card-meta span::before{ content:"კატეგორია"; }
    body[data-page="detail"] .detail-hero .card-meta time::before{ content:"თარიღი"; }
    body[data-page="detail"] .detail-hero .author-line::before{
      content:"ავტორი";

    }

    /* Desktop: image on the left, info cards stacked on the right */

    @media (min-width:1024px){

        grid-template-columns:minmax(0,1fr) 300px;

      body[data-page="detail"] .detail-hero:has(.detail-image) p{ grid-row:2; }

      body[data-page="detail"] .detail-hero:has(.detail-image) .card-meta time{

      body[data-page="detail"] .detail-hero:has(.detail-image) .author-line{

      }

    }

    /* ---------- Content sections ---------- */

    body[data-page="detail"] .detail-content{
      display:grid;
      grid-template-columns:repeat(12,minmax(0,1fr));
      gap:20px;
      max-width:none;
      margin:28px 0 0;
    }

    body[data-page="detail"] .detail-section{

      min-width:0;
      margin:0;
      padding:26px;
      background:linear-gradient(145deg,var(--panel),#0a1714);

      border-radius:14px;

      box-shadow:0 14px 35px #0004;

      align-items:center;

      margin:0 0 20px;
      padding-bottom:18px;
      border-bottom:1px solid var(--line);
      font:700 20px/1.25 Inter,FiraGO,sans-serif;
    }

      flex:none;
      width:36px;
      height:36px;
      padding:8px;
      border:1px solid #28dc9b40;
      border-radius:10px;
      background:#22d3950d;
      color:var(--green);
    }

      font-size:16px;
      line-height:1.85;
      overflow-wrap:anywhere;
    }

    body[data-page="detail"] .component-list{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
      gap:10px;
      margin:0;
      padding:0;
      list-style:none;
      counter-reset:component;
      white-space:normal;

  <!-- =========================================
       PRESENTATION HELPER
       Does not touch data or queries. After script.js has rendered the
       project it (1) turns the component lines into a tidy list and
       (2) removes the template indentation that script.js leaves inside
       the code block. script.js itself is unchanged.
  ========================================== -->

  <script>
    (function () {
      var root = document.getElementById('project-detail');
      if (!root) return;

      function enhance() {
        var detail = root.querySelector('.detail');
        if (!detail || detail.dataset.enhanced) return false;
        detail.dataset.enhanced = '1';

        var icon = detail.querySelector('.detail-section [data-lucide="package"]');
        var section = icon && icon.closest('.detail-section');
        var prose = section && section.querySelector('.prose');

        if (prose) {
          var lines = prose.textContent
            .split(/\r?\n/)
            .map(function (l) { return l.replace(/^\s*(?:[-•*·–—]+|\d+[.)])\s*/, '').trim(); })
            .filter(Boolean);

          if (lines.length) {
            var list = document.createElement('ul');
            list.className = 'component-list';
            lines.forEach(function (text) {
              var li = document.createElement('li');
              li.textContent = text;
              list.appendChild(li);
            });
            prose.textContent = '';
            prose.appendChild(list);
          }
        }

        var code = detail.querySelector('#arduino-code');
        if (code) code.textContent = code.textContent.trim();

        return true;
      }

      if (enhance()) return;

      var observer = new MutationObserver(function () {
        if (enhance()) observer.disconnect();
      });
      observer.observe(root, { childList: true, subtree: true });
    })();
